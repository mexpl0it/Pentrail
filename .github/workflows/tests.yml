name: tests

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.8"
            os: ubuntu-22.04
          - python: "3.10"
            os: ubuntu-24.04
          - python: "3.13"
            os: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: zsh, for the capture test in zsh
        run: sudo apt-get install -y --no-install-recommends zsh
      - name: compile
        run: python -m py_compile pentrail.py
      - name: unit tests
        run: python -m unittest discover -s tests -v

  tag-matches-version:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: the tag is the VERSION in pentrail.py
        run: |
          v=$(sed -n 's/^VERSION = "\([^"]*\)".*/\1/p' pentrail.py)
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME but VERSION $v"; exit 1; }
